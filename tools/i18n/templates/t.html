<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://a.not-yet.app; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self' https://a.not-yet.app; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>NFC tag · Not Yet</title>
<meta name="theme-color" content="#FBFAF8">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script src="/assets/js/theme-init.js"></script>
<link rel="stylesheet" href="/assets/css/site.css">
<script src="/assets/js/site.js" defer></script>
<script src="/assets/js/tag.js" defer></script>
<!-- Self-hosted, cookieless Umami: this website only, the app itself sends nothing.
     On /t/ pages a.js counts the path /t/ only, never the tag ID. -->
<script defer src="/assets/a.js"></script>
</head>
<!-- NFC tag fallback for /t/. Tags themselves link to /t/<id>, which GitHub Pages answers with 404.html (same view, see tag.js). Generated by tools/build-i18n.py. -->
<body>
<a class="skip" href="#main">{{common.skip}}</a>
<header class="nav">
  <div class="wrap">
    <a class="brand" href="/" aria-label="Not Yet"><svg viewBox="190 140 644 744" aria-hidden="true" focusable="false"><g transform="translate(0 -28)"><path d="M252 600L252 360A130 130 0 0 1 512 360L512 470A130 130 0 0 0 772 470L772 230M772 470L772 690C772 800 712 850 610 850" fill="none" stroke="currentColor" stroke-width="104" stroke-linecap="round" stroke-linejoin="round"/><circle class="ny-dot" cx="480" cy="850" r="52"/></g></svg><span>Not Yet</span></a>
    <div class="tools">
      {{@langmenu}}
      <button type="button" class="themebtn" id="theme-toggle" aria-pressed="false" aria-label="{{common.dark_mode}}" data-umami-event="theme-toggle"><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg></button>
    </div>
  </div>
</header>
<main id="main" class="solo">
<!--each-lang-->
  <div class="solo-inner" data-view="tag" data-lang="{{@code}}" lang="{{@lang}}" data-title="{{tag.page_title}} · Not Yet" data-skip="{{common.skip}}" data-dark="{{common.dark_mode}}" data-menu="{{common.language}}: {{@langname}}"{{@hidden_unless_en}}>
    <svg class="mark" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="14" y="6" width="36" height="52" rx="8"/><path d="M26 24a8 8 0 0 1 0 12M31 20a14 14 0 0 1 0 20M36 16a20 20 0 0 1 0 28"/></svg>
    <h1>{{tag.title}}</h1>
    <p>{{tag.text}}</p>
    <a class="btn open-app" href="notyet://">{{tag.open}}</a>
    <span class="tagid"></span>
    <p class="small">{{tag.get}}</p>
  </div>
<!--/each-lang-->
</main>
</body>
</html>
